services:
  mysql:
    image: mysql:8.4
    container_name: saludbot-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-saludbot_root_dev}
      MYSQL_DATABASE: ${DB_NAME:-chat_bot_salud}
      MYSQL_USER: ${DB_USER:-saludbot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-saludbot_dev}
    ports:
      # Solo loopback: la base no queda expuesta a la tailnet.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Se ejecuta una unica vez, cuando el volumen esta vacio.
      - ./sql/crear_mysql_saludbot.sql:/docker-entrypoint-initdb.d/01_crear_mysql_saludbot.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-saludbot_root_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
